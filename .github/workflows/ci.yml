# CI: runs on every PR and every push to main. Goal: nothing broken ever reaches main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  workflow_call:            # lets cd.yml reuse this exact pipeline before releasing

# A newer push to the same branch/PR cancels the older still-running CI (saves minutes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Formatting
        run: ruff format --check .

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Unit + API + MCP tests
        run: python -m pytest -q

  docker:
    name: docker
    needs: [lint, test]       # only build the image if the cheap checks pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build image
        run: docker build -t doc-intel:ci .
      - name: Smoke test the container
        run: |
          docker run -d --name api -p 8000:8000 doc-intel:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/ready && break
            sleep 1
          done
          curl -fsS -X POST http://localhost:8000/v1/query \
            -H 'content-type: application/json' \
            -d '{"question":"How often must Tier 1 vendors be reassessed?"}' | grep -q vendor_risk_policy
      - name: Show container logs on failure
        if: failure()
        run: docker logs api
