services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: [.env]
    volumes:
      - index:/app/data/index
  mcp:                      # remote-capable MCP server (streamable HTTP) in front of the API
    build: .
    command: ["python", "-m", "mcp_server.server", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DOC_API_URL: http://api:8000
      # DOC_API_KEY: ${API_KEY}
    ports: ["8080:8000"]
    depends_on: [api]
volumes:
  index:
