services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file:
      - path: .env
        required: false
    volumes:
      - index:/app/data/index
  mcp:                      # remote-capable MCP server (streamable HTTP) in front of the API
    build: .
    command: ["python", "-m", "mcp_server.server", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DOC_API_URL: http://api:8000
      # DOC_API_KEY: ${API_KEY}
    ports: ["8080:8000"]
    # The image's default healthcheck calls /health, which only the API has.
    # For MCP we just check that the port accepts connections.
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2)"]
      interval: 30s
      timeout: 3s
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy   # start MCP only once the API is actually ready
volumes:
  index: